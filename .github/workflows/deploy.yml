name: Deploy PROD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: batixpro-mcp-production
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build application
        run: npm run build

      - name: Build production image
        run: docker build --progress=plain --tag batixpro-mcp:ci .

  deploy:
    needs: verify
    if: ${{ vars.VPS_HOST != '' && vars.VPS_USER != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ vars.VPS_HOST }}
          username: ${{ vars.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          command_timeout: 15m
          script: |
            set -eu

            MCP_DIR=/opt/batix/apps/prod/batixpro_MCP
            C="docker compose -f compose.yaml -f compose.vps.yaml"

            test -d "$MCP_DIR/.git"
            test -f "$MCP_DIR/.env"
            cd "$MCP_DIR"

            # Une modification faite à la main sur le VPS n'est jamais effacée en
            # silence : elle est mise de côté (git stash list) et affichée ici, pour
            # être reportée dans le dépôt si elle doit durer.
            echo "=== 1. Sauvegarde des modifications locales éventuelles ==="
            if ! git diff --quiet || ! git diff --cached --quiet; then
              git diff
              git -c user.name=deploy -c user.email=deploy@localhost stash push -m "deploy-backup-$(date +%Y%m%d-%H%M%S)"
            fi

            echo "=== 2. Mise à jour du dépôt MCP ==="
            git fetch origin main
            git reset --hard origin/main

            # Construire AVANT de basculer : l'ancien MCP sert pendant le build, et un
            # build raté (set -e) le laisse en service.
            echo "=== 3. Validation et construction ==="
            docker network inspect web >/dev/null
            $C config --quiet
            $C build --pull mcp

            echo "=== 4. Bascule du MCP ==="
            $C up -d --no-deps --force-recreate --wait mcp

            echo "=== 5. Vérification de santé ==="
            $C exec -T mcp node -e "fetch('http://127.0.0.1:3000/health').then(async (response) => { const body = await response.json(); console.log(JSON.stringify(body)); if (!response.ok || body.status !== 'ok' || body.laravel_reachable !== true) process.exit(1); }).catch((error) => { console.error(error); process.exit(1); });"
            $C ps mcp

            echo "=== 6. Nettoyage des anciennes images ==="
            docker image prune -f

            echo "=== Deploy SUCCESS ==="

      # Vu d'Internet, comme le voit le SaaS (BATIXPRO_MCP_URL) : Traefik route bien
      # vers le nouveau MCP, et une requête sans token est refusée.
      - name: Verify public endpoint
        run: |
          for i in 1 2 3 4 5 6; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 -X POST \
              -H 'Content-Type: application/json' \
              -H 'Accept: application/json, text/event-stream' \
              -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' \
              https://${{ vars.MCP_PUBLIC_HOST || 'mcp.batixapp.com' }}/mcp || true)
            echo "Tentative $i : HTTP $code"
            if [ "$code" = "401" ]; then
              echo "MCP public OK : requête sans token refusée (401)."
              exit 0
            fi
            sleep 10
          done
          echo "::error::https://${{ vars.MCP_PUBLIC_HOST || 'mcp.batixapp.com' }}/mcp ne répond pas 401 sans token. L'assistant IA du SaaS est probablement coupé."
          exit 1
